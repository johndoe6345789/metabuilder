# Local stack: nginx -> Next.js app -> DBAL.
#
# Every image is pulled from GHCR, built by GitHub Actions. There is no `build:`
# key anywhere in this file on purpose - `docker compose up` here can never
# compile anything locally.
#
#   nginx       ghcr.io/johndoe6345789/metabuilder/nginx        (.github/workflows/docker.yml)
#   nextjs-app  ghcr.io/johndoe6345789/metabuilder/nextjs-app   (.github/workflows/docker.yml)
#   dbal        ghcr.io/johndoe6345789/dbal                     (dbal repo)
#   postgres    postgres:17-alpine                              (Docker Hub)
#   redis       redis:7-alpine                                  (Docker Hub)
#   elasticsearch docker.elastic.co/elasticsearch/elasticsearch:8 (Elastic)
#   postgres-ui ghcr.io/johndoe6345789/postgres                    (postgres repo)
#
# Only nginx publishes a port. The app and DBAL are reachable only on the
# internal network, which matches how the browser actually talks to them: the
# app's NEXT_PUBLIC_DBAL_API_URL is baked to the relative path /api/dbal, so
# every DBAL call from the browser arrives via nginx on the same origin.
#
#   docker compose -f deploy/compose.yml up -d
#   open http://localhost:8080/app

name: metabuilder-local

services:
  nginx:
    image: ghcr.io/johndoe6345789/metabuilder/nginx:${TAG:-latest}
    container_name: metabuilder-nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
    depends_on:
      nextjs-app:
        condition: service_healthy
      dbal:
        condition: service_started
    networks: [metabuilder]

  nextjs-app:
    image: ghcr.io/johndoe6345789/metabuilder/nextjs-app:${TAG:-latest}
    container_name: metabuilder-nextjs
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      # Server-side calls: straight to the container, no proxy hop. The
      # NEXT_PUBLIC_* equivalents are compiled into the browser bundle and
      # cannot be set here - see deploy/nginx/Dockerfile.
      DBAL_API_URL: http://dbal:8080
      DBAL_ENDPOINT: http://dbal:8080
      DBAL_DEFAULT_TENANT: ${DBAL_TENANT:-system}
      DBAL_DEFAULT_PACKAGE: ${DBAL_PACKAGE:-core}
      DBAL_ADMIN_TOKEN: ${DBAL_ADMIN_TOKEN:-local-dev-admin-token}
      # The app's server components call its own API over HTTP, and Node's
      # fetch rejects relative URLs (src/lib/entities/api-client.ts).
      METABUILDER_INTERNAL_URL: http://127.0.0.1:3000/app
      # Blob storage (src/lib/object-store/client.ts). AuthFilter there
      # checks "Authorization: AWS <key>:<secret>" against an api_keys DB
      # row, not an env var on that service -- these must match whatever's
      # actually seeded (migrations/002_seed_data.sql), not be invented
      # here. Default is that seed's dev key.
      OBJECT_STORE_URL: http://object-store:9000
      OBJECT_STORE_ACCESS_KEY: ${OBJECTSTORE_ACCESS_KEY:-minioadmin}
      OBJECT_STORE_SECRET_KEY: ${OBJECTSTORE_SECRET_KEY:-minioadmin}
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "-O", "/dev/null",
             "http://127.0.0.1:3000/app/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks: [metabuilder]

  postgres:
    image: postgres:17-alpine
    container_name: metabuilder-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dbal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dbal}
      POSTGRES_DB: ${POSTGRES_DB:-dbal}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # -U must match POSTGRES_USER: pg_isready defaults to the OS user (root),
      # which does not exist as a role here, so the check would never pass.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dbal} -d ${POSTGRES_DB:-dbal}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks: [metabuilder]

  redis:
    image: redis:7-alpine
    container_name: metabuilder-redis
    restart: unless-stopped
    # Cache only. Everything in here is reconstructible from Postgres, so no
    # volume and no persistence: losing it costs a slow first read, and an
    # unpersisted cache cannot come back stale after a restart.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks: [metabuilder]

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: metabuilder-elasticsearch
    # Opt-in: it wants ~1GB of heap even idle, which is a lot to impose on
    # everyone running the stack just to read the app.
    #   docker compose -f deploy/compose.yml --profile search up -d
    profiles: [search]
    restart: unless-stopped
    environment:
      discovery.type: single-node
      # Local dev only. With security on, ES demands TLS and a bootstrap
      # password before it will answer anything, and DBAL's search layer has
      # no credential configuration -- so this is off deliberately rather than
      # by oversight. Do not copy this into a deployed environment.
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: ${ES_JAVA_OPTS:--Xms512m -Xmx512m}
      # Single node means replicas can never be allocated; without this every
      # index sits yellow and looks broken.
      cluster.routing.allocation.disk.threshold_enabled: "false"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      # wait_for_status=yellow means yellow-or-better, so this passes on a
      # green cluster too. It is the right gate rather than green because any
      # index created with replicas can never allocate them on a single node
      # and would sit yellow forever -- verified green here with ES 8's
      # single-node default of 0 replicas.
      test: ["CMD-SHELL", "curl -fsS 'http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow&timeout=5s' >/dev/null || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 24
      start_period: 30s
    networks: [metabuilder]

  dbal:
    image: ghcr.io/johndoe6345789/dbal:${DBAL_TAG:-latest}
    container_name: metabuilder-dbal
    restart: unless-stopped
    depends_on:
      # DBAL creates tables and seeds at boot, so it must not start against a
      # Postgres still initialising -- service_started would race it.
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DBAL_ADAPTER: postgres
      # Host is the compose service name; 5432 is never published, so nothing
      # here collides with a Postgres already running on the host.
      DATABASE_URL: "postgresql://${POSTGRES_USER:-dbal}:${POSTGRES_PASSWORD:-dbal}@postgres:5432/${POSTGRES_DB:-dbal}"
      # Read-through cache in front of Postgres, not instead of it: a miss
      # falls through and backfills, and every cache failure degrades to a
      # database read, so Redis is never authoritative. ttl bounds how long a
      # write made outside DBAL (psql, a migration) can be masked.
      #
      # Requires a dbal image built after the caching layer landed; older
      # images ignore this variable entirely and simply run uncached.
      DBAL_CACHE_URL: ${DBAL_CACHE_URL:-redis://redis:6379/0?ttl=300&pattern=read-through}
      # Mirrors writes into Elasticsearch and backs
      # GET /api/dbal/{tenant}/{package}/{Entity}/_search?q=...
      #
      # No depends_on for elasticsearch: it is behind the `search` profile, and
      # depending on a profiled service breaks `up -d` without that profile.
      # Nothing is lost by starting first -- mirroring is best-effort, so
      # writes made before ES is up are simply absent from the index until
      # those records are next written.
      #
      # refresh=true so a write is searchable immediately; that costs indexing
      # throughput and is a local-development choice, not a default to deploy.
      DBAL_SEARCH_URL: ${DBAL_SEARCH_URL:-http://elasticsearch:9200?index=dbal_search&refresh=true}
      DBAL_AUTO_CREATE_TABLES: "true"
      DBAL_SEED_ON_STARTUP: "true"
      DBAL_SEED_DIR: /app/seeds/database
      # Without this the daemon logs a warning at boot and every route whose
      # schema sets require_auth=true answers 503.
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-local-dev-secret-change-me}
      DBAL_ADMIN_TOKEN: ${DBAL_ADMIN_TOKEN:-local-dev-admin-token}
      # Same-origin through nginx, so no cross-origin request is ever made.
      DBAL_CORS_ORIGIN: ${DBAL_CORS_ORIGIN:-*}
      DBAL_LOG_LEVEL: ${DBAL_LOG_LEVEL:-info}
      # --- OIDC provider (the /app/login button is dead without this) --------
      # Unset, server_routes.cpp logs "OIDC provider is DISABLED" at boot and
      # every /oidc/* route 404s, so the login page's redirect lands on
      # Drogon's 404 page rather than a sign-in form.
      #
      # The issuer is the browser-facing base URL, not the container address:
      # oidc_service.cpp derives authorization_endpoint, token_endpoint, jwks_uri
      # and the "iss" claim from it by string concatenation. dbal:8080 would
      # mint tokens no browser could ever resolve.
      DBAL_OIDC_ISSUER: ${DBAL_OIDC_ISSUER:-http://localhost:${HTTP_PORT:-8080}/api/dbal}
      # nginx strips /api/dbal before proxying, so DBAL sees /oidc/authorize at
      # its root and builds Location headers and <form action> the same way.
      # Without the prefix it redirects to /oidc/login, which nginx routes to
      # the Next.js app instead of back here.
      DBAL_PUBLIC_PATH_PREFIX: ${DBAL_PUBLIC_PATH_PREFIX:-/api/dbal}
    volumes:
      - dbal-data:/app/data
      # The image ships no clients.json, and a missing one throws inside the
      # try/catch that disables the provider. Mounted at the path
      # DBAL_OIDC_CLIENTS_CONFIG defaults to.
      - ./oidc/clients.json:/app/schemas/oidc/clients.json:ro
      # RsaKeypair generates a key when the path is empty, so no PEM is
      # committed -- but /app/keys is baked into the image, so without a volume
      # a fresh key is minted on every restart and all outstanding tokens
      # silently stop verifying.
      - dbal-keys:/app/keys
    healthcheck:
      # curl, not wget: the dbal image ships curl only, and a missing binary
      # leaves the container in "starting" forever rather than failing loudly.
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health | grep -q healthy"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    networks: [metabuilder]

  # S3-compatible object store (github.com/johndoe6345789/object-store) --
  # for blobs (uploads, package assets, media); DBAL keeps structured/text
  # data as it already does. Not behind a profile like elasticsearch: its
  # own Postgres is a lightweight alpine instance with a handful of tables
  # (buckets/objects), nothing like ES's footprint, and this is meant to be
  # a first-class capability rather than opt-in dev tooling.
  objectstore-postgres:
    image: postgres:17-alpine
    container_name: metabuilder-objectstore-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${OBJECTSTORE_POSTGRES_USER:-objectstore}
      POSTGRES_PASSWORD: ${OBJECTSTORE_POSTGRES_PASSWORD:-objectstore}
      POSTGRES_DB: ${OBJECTSTORE_POSTGRES_DB:-objectstore}
    volumes:
      - objectstore-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${OBJECTSTORE_POSTGRES_USER:-objectstore} -d ${OBJECTSTORE_POSTGRES_DB:-objectstore}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks: [metabuilder]

  object-store:
    image: ghcr.io/johndoe6345789/object-store:${OBJECTSTORE_TAG:-latest}
    container_name: metabuilder-object-store
    restart: unless-stopped
    depends_on:
      objectstore-postgres:
        condition: service_healthy
    environment:
      # entrypoint.sh's migration step reads these PG* vars directly (psql
      # convention). The server binary itself does NOT -- it only reads
      # S3_DB_CONN, a single libpq keyword/value string (see main.cpp's
      # default: "host=localhost port=5432 dbname=s3server user=s3user
      # password=s3pass"), so both have to be set and have to agree.
      PGHOST: objectstore-postgres
      PGPORT: "5432"
      PGUSER: ${OBJECTSTORE_POSTGRES_USER:-objectstore}
      PGPASSWORD: ${OBJECTSTORE_POSTGRES_PASSWORD:-objectstore}
      PGDATABASE: ${OBJECTSTORE_POSTGRES_DB:-objectstore}
      S3_DB_CONN: "host=objectstore-postgres port=5432 dbname=${OBJECTSTORE_POSTGRES_DB:-objectstore} user=${OBJECTSTORE_POSTGRES_USER:-objectstore} password=${OBJECTSTORE_POSTGRES_PASSWORD:-objectstore}"
      S3_PORT: "9000"
      # AuthFilter expects "Authorization: AWS <key>:<secret>" checked
      # against an api_keys DB table, not an env var -- there is no
      # S3_ACCESS_KEY/S3_SECRET_KEY the binary reads. Credentials come from
      # migrations/002_seed_data.sql's seeded row (access_key=secret_key=
      # 'minioadmin', permissions='read,write,admin'). The Next.js client
      # (OBJECT_STORE_ACCESS_KEY/SECRET_KEY on nextjs-app, below) must match
      # this seed, not the other way around.
    volumes:
      - objectstore-data:/data/s3
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks: [metabuilder]

  # Postgres admin UI (github.com/johndoe6345789/postgres), pointed at the
  # stack's database rather than the one its own docker-compose.yml bundles.
  # Opt-in, since it is an admin surface: `--profile tools`.
  #
  #   docker compose -f deploy/compose.yml --profile tools up -d
  #   open http://localhost:3100/postgres
  postgres-ui:
    image: ghcr.io/johndoe6345789/postgres:${PGUI_TAG:-latest}
    container_name: metabuilder-postgres-ui
    profiles: [tools]
    restart: unless-stopped
    # No platform pin: this image is dual-arch and runs natively. It previously
    # came from metabuilder-small, whose pipeline is retired -- that image was a
    # frozen amd64-only artifact nothing rebuilt, and had to run emulated here.
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${PGUI_PORT:-3100}:3000"
    environment:
      NODE_ENV: production
      # Its env schema demands the analytics/telemetry keys this stack has no
      # use for; without this the container exits at boot on validation.
      SKIP_ENV_VALIDATION: "true"
      DATABASE_URL: "postgresql://${POSTGRES_USER:-dbal}:${POSTGRES_PASSWORD:-dbal}@postgres:5432/${POSTGRES_DB:-dbal}"
      JWT_SECRET: ${JWT_SECRET_KEY:-local-dev-secret-change-me}
      DBAL_ENDPOINT: http://dbal:8080
      # next.config.ts sets basePath '/postgres'; the app 307s / to
      # /postgres/admin/dashboard, so the path is not optional.
      NEXT_PUBLIC_BASE_PATH: /postgres
      NEXT_PUBLIC_APP_URL: http://localhost:${PGUI_PORT:-3100}
      NEXT_PUBLIC_SENTRY_DISABLED: "true"
    networks: [metabuilder]

networks:
  metabuilder:
    driver: bridge

volumes:
  # Still mounted at /app/data even on Postgres: the path is baked into the
  # image and DBAL writes there for things other than the old sqlite file.
  dbal-data:
  dbal-keys:
  postgres-data:
  elasticsearch-data:
  objectstore-postgres-data:
  objectstore-data:
