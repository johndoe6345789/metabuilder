events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;

  access_log /dev/stdout;
  error_log  /dev/stderr warn;

  # Docker's embedded DNS. Upstreams are referenced through variables below so
  # that nginx resolves them per request instead of at startup - without this,
  # nginx refuses to start whenever a service in the stack is not yet up, and
  # a restart of that service leaves nginx holding a stale address.
  resolver 127.0.0.11 ipv6=off valid=10s;

  # Next.js dev/HMR websockets and DBAL's event stream both need the upgrade
  # header passed through untouched.
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  server {
    listen 80;
    server_name _;

    # Uploads to DBAL's blob endpoints; the 1m default rejects most media.
    client_max_body_size 64m;

    # Proxy health, distinct from the health of what it proxies to.
    location = /healthz {
      access_log off;
      add_header Content-Type application/json;
      return 200 '{"status":"healthy","service":"nginx"}';
    }

    # The app owns /app (basePath in next.config.ts); nothing is served at the
    # root, so send visitors there rather than showing them a 404.
    #
    # absolute_redirect off keeps the Location header relative. nginx would
    # otherwise build an absolute URL from $host, which carries no port, and
    # send a browser on http://localhost:8080/ to http://localhost/app.
    location = / {
      absolute_redirect off;
      return 302 /app;
    }

    # Browser-facing DBAL. The app calls /api/dbal/... and DBAL serves those
    # routes at its own root, so the prefix is stripped on the way through.
    #
    # `break` rather than `last`: the rewritten URI must go to this block's
    # proxy_pass, not be re-matched against the location list, where /api/...
    # would fall through to the app.
    location /api/dbal/ {
      set $dbal_upstream dbal;
      rewrite ^/api/dbal/(.*)$ /$1 break;
      proxy_pass http://$dbal_upstream:8080;

      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade           $http_upgrade;
      proxy_set_header Connection        $connection_upgrade;

      # DBAL answers its own CORS; duplicating it here yields two headers and
      # browsers reject that.
      proxy_pass_header Access-Control-Allow-Origin;
    }

    # Everything else belongs to the Next.js app, including /app/api/* — those
    # are the app's own route handlers, which reach DBAL server-side.
    location / {
      set $app_upstream nextjs-app;
      proxy_pass http://$app_upstream:3000;

      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade           $http_upgrade;
      proxy_set_header Connection        $connection_upgrade;

      proxy_read_timeout 60s;
    }
  }
}
