version: '3.8'

services:
  # SMTP Relay Service (Postfix)
  postfix:
    image: boky/postfix:latest
    container_name: emailclient-postfix
    environment:
      ALLOWED_SENDER_DOMAINS: 'example.com localhost'
      RELAYHOST: '[smtp.gmail.com]:587'
      RELAYHOST_USERNAME: ''
      RELAYHOST_PASSWORD: ''
      POSTFIX_myhostname: 'emailclient.local'
      POSTFIX_mynetworks: '127.0.0.0/8 10.0.0.0/8'
    ports:
      - '1025:25'
      - '1587:587'
    networks:
      - emailclient-net
    restart: unless-stopped

  # IMAP Server (Dovecot)
  dovecot:
    image: dovecot/dovecot:latest
    container_name: emailclient-dovecot
    environment:
      DOVECOT_PROTOCOLS: 'imap pop3'
      DOVECOT_MAIL_HOME: '/var/mail'
      DOVECOT_USER_DB: 'static'
      DOVECOT_PASS_DB: 'static'
    ports:
      - '1143:143'
      - '1993:993'
      - '1110:110'
      - '1995:995'
    volumes:
      - dovecot-data:/var/mail
    networks:
      - emailclient-net
    restart: unless-stopped

  # Email Service (C++/Drogon backend). All persistence goes through DBAL
  # (EmailClient/EmailFolder/EmailMessage entities) -- no local database.
  # DBAL_BASE_URL etc. are left to the environment/.env, same as this
  # repo's other standalone frontend compose files (e.g.
  # frontends/pastebin/docker-compose.yml) -- the real deploy path is
  # deployment/metabuilder/compose.yml, which wires up a real dbal service.
  email-service:
    image: emailclient-service:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: emailclient-email-service
    environment:
      PORT: "5000"
      POSTFIX_HOST: postfix
      POSTFIX_PORT: 25
      DOVECOT_HOST: dovecot
      DOVECOT_IMAP_PORT: 143
      DOVECOT_IMAP_SSL_PORT: 993
    ports:
      - '8500:5000'
    depends_on:
      postfix:
        condition: service_started
      dovecot:
        condition: service_started
    networks:
      - emailclient-net
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  dovecot-data:

networks:
  emailclient-net:
    driver: bridge
