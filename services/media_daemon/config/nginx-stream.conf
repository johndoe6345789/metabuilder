# Nginx configuration for HLS streaming
# Optimized for low-latency video delivery

server {
    listen 80;
    server_name _;

    # nginx does NOT inherit add_header from an outer context into a
    # location block that defines its own add_header directives — every
    # location below that sets Cache-Control/Pragma/Expires must redeclare
    # these CORS headers too, or they silently vanish. Confirmed live: a
    # browser's hls.js failed every HLS load with a CORS error even though
    # this exact "Enable CORS" block was right here at server level — curl
    # showed Cache-Control/Pragma/Expires present (from the nested .m3u8
    # location) but Access-Control-Allow-Origin missing.
    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'Origin, Content-Type, Accept, Range' always;
    add_header 'Access-Control-Expose-Headers' 'Content-Length, Content-Range' always;

    # Cache settings
    add_header Cache-Control 'no-cache';

    # HLS/DASH content
    location /hls {
        alias /data/hls;

        # MIME types for HLS
        types {
            application/vnd.apple.mpegurl m3u8;
            video/mp2t ts;
            application/dash+xml mpd;
            video/mp4 mp4 m4s;
        }

        # Caching for segments
        location ~ \.ts$ {
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Origin, Content-Type, Accept, Range' always;
            add_header 'Access-Control-Expose-Headers' 'Content-Length, Content-Range' always;
            add_header Cache-Control 'public, max-age=31536000';
        }

        location ~ \.m4s$ {
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Origin, Content-Type, Accept, Range' always;
            add_header 'Access-Control-Expose-Headers' 'Content-Length, Content-Range' always;
            add_header Cache-Control 'public, max-age=31536000';
        }

        # No caching for playlists
        location ~ \.m3u8$ {
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Origin, Content-Type, Accept, Range' always;
            add_header 'Access-Control-Expose-Headers' 'Content-Length, Content-Range' always;
            add_header Cache-Control 'no-cache, no-store, must-revalidate';
            add_header Pragma 'no-cache';
            add_header Expires '0';
        }

        location ~ \.mpd$ {
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Origin, Content-Type, Accept, Range' always;
            add_header 'Access-Control-Expose-Headers' 'Content-Length, Content-Range' always;
            add_header Cache-Control 'no-cache, no-store, must-revalidate';
            add_header Pragma 'no-cache';
            add_header Expires '0';
        }
    }

    # Radio streams (HLS)
    location /radio {
        alias /data/hls/radio;

        types {
            application/vnd.apple.mpegurl m3u8;
            video/mp2t ts;
            audio/aac aac;
        }

        location ~ \.m3u8$ {
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Origin, Content-Type, Accept, Range' always;
            add_header 'Access-Control-Expose-Headers' 'Content-Length, Content-Range' always;
            add_header Cache-Control 'no-cache';
        }
    }

    # TV streams (HLS)
    location /tv {
        alias /data/hls/tv;

        types {
            application/vnd.apple.mpegurl m3u8;
            video/mp2t ts;
            video/mp4 mp4 m4s;
        }

        location ~ \.m3u8$ {
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Origin, Content-Type, Accept, Range' always;
            add_header 'Access-Control-Expose-Headers' 'Content-Length, Content-Range' always;
            add_header Cache-Control 'no-cache';
        }
    }

    # Native HTTP audio streaming — proxy to media-daemon's /stream/:mount endpoint
    # Listeners connect here instead of directly to media-daemon:8090.
    # e.g. GET http://nginx-stream:8088/stream/my-channel
    location /stream/ {
        proxy_pass         http://media-daemon:8090/stream/;
        proxy_http_version 1.1;

        # Required for chunked/streaming responses
        proxy_buffering    off;
        proxy_cache        off;

        # Keep the connection alive for the duration of the audio stream
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # Forward original host info
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;

        # Pass ICY headers through to the client
        proxy_set_header   icy-metadata 1;
    }

    # Health check
    location /nginx-health {
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    # Gzip
    gzip on;
    gzip_types application/vnd.apple.mpegurl application/dash+xml;
}
