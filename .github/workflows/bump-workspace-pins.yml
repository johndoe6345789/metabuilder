name: bump-workspace-pins

# .github/workspace.json records a commit SHA for every sibling micro-repo.
# Builds no longer resolve to those SHAs -- they take branch heads, so sibling
# changes arrive without waiting for this job (see assemble_workspace.py). What
# the pins still buy is a known-good set that --pinned can rebuild from, which
# is only useful while it is current and still exists: a force-pushed sibling
# leaves a ref that cannot be fetched at all.
#
# So this job's purpose changed rather than disappeared: it keeps that fallback
# record fetchable and roughly current.
#
# Note what it no longer does. The PR it opens touches .github/workspace.json,
# which does trigger nextjs.yml -- but that run assembles floating like every
# other run, so it exercises the branch heads, not the SHAs being recorded. A
# green bump PR is therefore not evidence that the pinned set builds. Nothing
# routinely proves that any more; --pinned is a best-effort escape hatch, and
# the further back you reach with it the likelier it is to have rotted.

on:
  schedule:
    # Mondays, 06:00 UTC.
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      repos:
        description: 'Comma-separated repo names to bump (blank = all)'
        type: string
        default: ''

concurrency:
  group: bump-workspace-pins
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    name: Bump sibling repo pins
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Bump pins
        id: bump
        env:
          # A PAT is needed here if any sibling repo is private; the default
          # token can only see this repository.
          GITHUB_TOKEN: ${{ secrets.WORKSPACE_TOKEN || secrets.GITHUB_TOKEN }}
          SELECTED_REPOS: ${{ inputs.repos }}
        run: |
          args=()
          if [ -n "$SELECTED_REPOS" ]; then
            IFS=',' read -ra names <<< "$SELECTED_REPOS"
            for name in "${names[@]}"; do
              trimmed="$(echo "$name" | tr -d '[:space:]')"
              [ -n "$trimmed" ] && args+=(--repo "$trimmed")
            done
          fi
          python3 .github/scripts/bump_pins.py "${args[@]}"

      - name: Open pull request
        if: ${{ steps.bump.outputs.count != '' && steps.bump.outputs.count != '0' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANGED: ${{ steps.bump.outputs.changed }}
          COUNT: ${{ steps.bump.outputs.count }}
        run: |
          BRANCH="chore/bump-workspace-pins-${GITHUB_RUN_ID}"

          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git checkout -b "$BRANCH"
          git add .github/workspace.json
          git commit -m "chore(ci): bump sibling repo pins (${COUNT} repo(s))"
          git push origin "$BRANCH"

          {
            echo "Moves the sibling micro-repo pins in \`.github/workspace.json\`"
            echo "to their current branch heads."
            echo
            echo "Repos bumped (${COUNT}):"
            echo
            printf '%s\n' "$CHANGED" | tr ',' '\n' | sed 's/^/- /'
            echo
            echo "The nextjs and qt6 workflows run against these new pins on this"
            echo "PR, so merging it means the updated set is known to build."
          } > /tmp/pr-body.md

          gh pr create \
            --title "chore(ci): bump workspace pins (${COUNT} repo(s))" \
            --body-file /tmp/pr-body.md \
            --base "${GITHUB_REF_NAME}" \
            --head "$BRANCH"
